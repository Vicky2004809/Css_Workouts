<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        display: grid;
        grid-template-areas:         
        "header header header"
        "nav article ads"
        "footer footer footer";
grid-template-rows: 80px 1fr 30px;
grid-template-columns: 1fr 20% 70px;
grid-gap:10px;
height:  100vh;
margin:0;
}

header, footer, article, nav, div{
    padding :20px;
    background: yellow;
}

#pageHeader{
    grid-area : header;

}
#pageFooter{
    grid-area: footer;
}

#mainArticle{
    grid-area: article;
}

#siteAds {
    grid-area: ads;
}
#pageFooter{
     grid-area: footer;
}

</style>
<body>
    <header id="pageHeader"> Header </header>
    <article id="mainArticle" > Articale </article>
    <nav id="mainNav"> Nav </nav>
    <div id="siteAds"> Ads </div>
    <footer id="pageFooter"> Footer </footer>

    
</body>
</html>
